name: Build and validate TradeNPC

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Analyze API 5 source and build plugin PHAR
    runs-on: ubuntu-24.04
    steps:
      - name: Check out unified TradeNPC source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Verify release source archive excludes unrelated license scopes
        shell: bash
        run: |
          set -euo pipefail
          archive_dir="$(mktemp -d)"
          git archive --format=tar HEAD | tar -xf - -C "$archive_dir"
          test -f "$archive_dir/LICENSE"
          test -f "$archive_dir/plugin.yml"
          test ! -e "$archive_dir/TradeAPI-stable"
          test ! -e "$archive_dir/TradeNPC-Fixed-master-api4-legacy"
          test -f "$archive_dir/src/nlog/trade/TradeAPI.php"

      - name: Check out Axolotl-PM 5.0.0 source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: axolotl-pm/PocketMine-MP
          ref: b16cc69974d4e805d21e6328ab77c0e17cd7116d
          path: .devtools-dependencies/axolotl-5.0.0
          persist-credentials: false

      - name: Check out Axolotl-PM 5.51.1 source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: axolotl-pm/PocketMine-MP
          ref: e881fc1bc1c401545baf6bd1f824e41ff3f57bd1
          path: .devtools-dependencies/axolotl-5.51.1
          persist-credentials: false

      - name: Check out InvMenu 4.6.1 source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Muqsit/InvMenu
          ref: 20ffa94a2dde27d51274e43d498835d608a6f861
          path: .devtools-dependencies/virions/InvMenu
          persist-credentials: false

      - name: Check out Axolotl PHP setup helper
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: axolotl-pm/setup-php-action
          ref: b8c3f9add4f2ad4a5e2624a1112aba899ee8db0e
          path: .devtools-dependencies/setup-php-action
          persist-credentials: false

      - name: Set up Axolotl PHP environment
        shell: bash
        env:
          INPUT_PHP-VERSION: "8.4"
          INPUT_PM-VERSION-MAJOR: "5"
          INPUT_INSTALL-PATH: ./.php-bin
        run: node .devtools-dependencies/setup-php-action/dist/index.js

      - name: Install API-floor Axolotl-PM source dependencies
        run: composer install --no-dev --no-interaction --prefer-dist --no-progress
        working-directory: .devtools-dependencies/axolotl-5.0.0

      - name: Lint unified plugin and test PHP
        shell: bash
        run: find src tests examples -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: Analyze both API 5 revisions and build the unified PHAR
        id: build
        uses: NhanAZ/DevTools@v2 # v2
        with:
          project: .
          virions: .devtools-dependencies/virions
          output: build
          phpstan: max
          phpstan-server: |
            .devtools-dependencies/axolotl-5.0.0
            .devtools-dependencies/axolotl-5.51.1
          phpstan-paths: .devtools-dependencies/virions/InvMenu/src

      - name: Run trade packet, settlement and inventory fixtures
        shell: bash
        run: |
          set -euo pipefail
          for source in .devtools-dependencies/axolotl-5.0.0 .devtools-dependencies/axolotl-5.51.1; do
            export AXOLOTL_AUTOLOAD="$GITHUB_WORKSPACE/$source/vendor/autoload.php"
            for fixture in packet-guard trade-settlement recipe-input shop-nbt; do
              php "tests/$fixture.php"
            done
            for fixture in tradeapi-merchant-recipes tradeapi-inventory-storage tradeapi-listener-guards tradeapi-packet-headers tradeapi-inventory-actions; do
              php "tests/$fixture.php"
            done
          done

      - name: Verify PHAR contents, source boundary, and checksum
        shell: bash
        env:
          PHAR_PATH: ${{ steps.build.outputs.phar }}
          PHAR_SHA256: ${{ steps.build.outputs.sha256 }}
          BUILD_METADATA: ${{ steps.build.outputs.metadata }}
        run: |
          set -euo pipefail
          test "$(sha256sum "$PHAR_PATH" | cut -d ' ' -f 1)" = "$PHAR_SHA256"
          php -r '$p=new Phar(getenv("PHAR_PATH")); foreach(["plugin.yml","LICENSE","src/TradeNPC/Main.php","src/TradeNPC/TradePacketFactory.php","src/nlog/trade/TradeAPI.php","src/nlog/trade/merchant/MerchantRecipe.php","META-INF/virions/InvMenu/LICENSE"] as $f){if(!$p->offsetExists($f)){throw new RuntimeException("Missing PHAR entry: ".$f);}} foreach(["TradeAPI-stable/plugin.yml","TradeNPC-Fixed-master-api4-legacy/plugin.yml"] as $f){if($p->offsetExists($f)){throw new RuntimeException("Legacy source entered PHAR: ".$f);}}'
          cp "$BUILD_METADATA" build/build-metadata.json

      - name: Smoke test build on Axolotl-PM 5.0.0
        uses: ./.devtools-dependencies/setup-php-action
        with:
          php-version: "8.3"
          pm-version-major: "5"
          install-path: ./.php83-bin

      - name: Run Axolotl-PM 5.0.0 startup smoke test on PHP 8.3
        env:
          AXOLOTL_SOURCE: .devtools-dependencies/axolotl-5.0.0
          PLUGIN_PHAR: ${{ steps.build.outputs.phar }}
          PLUGIN_SHA256: ${{ steps.build.outputs.sha256 }}
          PHP_BIN: php
        run: python3 tests/api-floor-runtime-smoke.py

      - name: Upload verified TradeNPC artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: TradeNPC-${{ github.sha }}
          path: |
            ${{ steps.build.outputs.phar }}
            build/build-metadata.json
          if-no-files-found: error
